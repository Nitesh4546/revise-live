<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="ReviseLive - Real-Time Classroom Revision with diagnostic analytics and concept anchors." />
    <title>ReviseLive — Real-Time Classroom Revision</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('reviselive:theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#1F1F1F' : '#FFFFFF');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
